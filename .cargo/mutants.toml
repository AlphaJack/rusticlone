# The server's code is mutated too.
all_features = true

# The mutants run on Linux with every feature. Files that this build never compiles would always be missed:
# another system's, the tray's for macOS and Windows, and the ones for a build without the desktop.
exclude_globs = [
  "**/windows.rs",
  "**/windows/**",
  "**/macos.rs",
  "**/macos/**",
  "src/server/tray/icon.rs",
  "src/server/no_tray.rs",
  "src/server/desktop/headless.rs",
]

# Mutants dealt out one by one, so that shards finish together: in source order, those of slow files share a shard.
sharding = "round-robin"

# A mutant whose build takes three times the unmutated one is stopped. Such a build does not end: a loop in a
# `const fn` that never stops runs at compile time.
build_timeout_multiplier = 3.0
