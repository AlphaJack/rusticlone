name: Mutants on a PR

# Lists the mutations of the lines a PR changes that no test catches. Started by adding the `mutants` label;
# adding it again runs it again.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: mutants-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Each mutant is built anew: debug info only slows every build and link.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  mutants:
    name: mutants of the diff
    if: github.event.label.name == 'mutants'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - name: Restore the dependencies built by the weekly run
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mutants
          save-if: false
      - name: Install cargo-nextest, cargo-mutants and cargo-binstall
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest,cargo-mutants,cargo-binstall
      # The rustic pinned in Cargo.toml, which the integration tests run.
      - name: Install rustic
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm --disable-strategies compile "rustic-rs@$(cargo metadata --format-version 1 --no-deps | jq -r '.metadata.rustic.version | ltrimstr("v")')"
      - name: Diff against the base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff "$BASE...HEAD" > "$RUNNER_TEMP/pr.diff"
      - name: Mutate the changed lines
        run: cargo mutants -vV --in-place --test-tool nextest --no-shuffle --in-diff "$RUNNER_TEMP/pr.diff"
      - name: Upload what the tests missed
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-pr-${{ github.event.pull_request.number }}
          path: mutants.out
