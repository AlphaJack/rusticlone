name: Nix

# Opens a pull request that updates flake.lock when its nixpkgs has a rustic older than the one Cargo.toml pins,
# which packaging/nix/package.nix refuses.
# requirements: the RELEASE_PLZ_TOKEN of release-plz.yml, whose pull requests start CI

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:

permissions: {}

jobs:

  lock:
    name: Update flake.lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Check the locked rustic
        id: locked
        run: |
          if nix eval --raw .#packages.x86_64-linux.default.drvPath; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update nixpkgs
        if: steps.locked.outputs.stale == 'true'
        run: nix flake update

      - name: Build
        if: steps.locked.outputs.stale == 'true'
        run: nix build -L

      - name: Open pull request
        if: steps.locked.outputs.stale == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          branch: nix-flake-lock
          delete-branch: true
          add-paths: flake.lock
          commit-message: "fix(deps): update nixpkgs for the rustic that Cargo.toml pins"
          title: "fix(deps): update nixpkgs for the rustic that Cargo.toml pins"
          body: |
            The Nix package refused the rustic of the nixpkgs in flake.lock, which is older than the one Cargo.toml pins. `nix flake update` took a newer nixpkgs, and the package builds with it.
