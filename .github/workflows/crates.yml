name: crates.io

# requirements:
# - secret CARGO_REGISTRY_TOKEN, a crates.io token that publishes rusticlone and rusticlone-macros

on:
  # by release.yml, once every target has built: a version on crates.io can't be taken back
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v3.0.0)
        required: true
        type: string

permissions: {}

jobs:

  crates:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"

      - name: Publish
        # a token until both crates trust this workflow on crates.io
        run: cargo publish --workspace --locked # zizmor: ignore[use-trusted-publishing]
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
