- name: Install sccache
  if: vars.CI_CACHE == 'sccache'
  uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
- name: Use sccache
  if: vars.CI_CACHE == 'sccache'
  shell: bash
  run: |
      { echo "SCCACHE_GHA_ENABLED=true"; echo "RUSTC_WRAPPER=sccache"; } >> "$GITHUB_ENV"
