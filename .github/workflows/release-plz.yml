name: Release PR

# requirements: a token other than the repository's, whose PRs and tags start no workflow
# - a GitHub App installed on this repository, with read and write access to contents and
#   pull requests
# - variable RELEASE_APP_CLIENT_ID and secret RELEASE_APP_PRIVATE_KEY, from that app

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  release-plz:
    name: Update release PR or tag
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    steps:

      - name: Create app token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # needed to list changes
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run release-plz
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
