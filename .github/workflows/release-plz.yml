name: Release PR

# requirements: a token other than the repository's, whose PRs and tags start no workflow
# - secret RELEASE_PLZ_TOKEN, a fine-grained PAT with read and write access to contents and
#   pull requests of this repository

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  release-plz:
    name: Update release PR or tag
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    steps:

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # needed to list changes
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run release-plz
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
