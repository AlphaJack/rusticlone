name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  fmt:
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          components: clippy, rust-analyzer
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: "false"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy without default features
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - name: Rustdoc
        run: cargo doc --workspace --no-deps --all-features --document-private-items --locked
      - name: Modules are acyclic
        run: cargo xtask acyclic

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          # Its timers, disks and privacy rules differ: Linux runs none of that code.
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: "false"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
      - name: Install cargo-binstall
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-binstall
      # The rustic pinned in Cargo.toml, which the tests run.
      - name: Install rustic
        run: cargo binstall --no-confirm "rustic-rs@$(sed -n '/^\[workspace.metadata.rustic\]/,/^\[/s/^version = "v\(.*\)"/\1/p' Cargo.toml)"
      - name: Put temporary files on a RAM disk, like /dev/shm on Linux
        if: runner.os == 'macOS'
        run: |
          dev=$(hdiutil attach -nomount ram://$((1024 * 2048)) | awk '{print $1}')
          diskutil erasevolume APFS ramdisk "$dev"
          echo "TMPDIR=/Volumes/ramdisk/" >> "$GITHUB_ENV"

      - name: Test
        run: cargo nextest run --workspace --locked
      - name: Check vendored htmx
        if: runner.os == 'Linux'
        run: cargo xtask vendor --check
      - name: Check the images rendered from the logo
        if: runner.os == 'Linux'
        run: cargo xtask logo --check
      - name: Check the systemd units, as the system's and a user's
        if: runner.os == 'Linux'
        run: |
          sudo ln -s "$PWD/target/debug/rusticlone" /usr/local/bin/
          for unit in packaging/linux/*.service; do
            systemd-analyze verify "$unit"
            systemd-analyze --user verify "$unit"
          done

  build:
    name: build (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: "false"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  nix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Evaluate the Nix package
        run: nix eval --raw .#packages.x86_64-linux.default.drvPath

  deny:
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  workflows:
    name: Check workflows
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT: v1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: zizmor

      - name: Install actionlint
        run: |
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/$ACTIONLINT/actionlint_${ACTIONLINT#v}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tgz" | sha256sum -c
          tar xzf actionlint.tgz actionlint

      - name: Run actionlint and zizmor
        run: |
          ./actionlint
          zizmor --offline .
